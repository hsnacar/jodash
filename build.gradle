plugins {
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id 'signing'
}

group = 'io.github.hsnacar'
version = '0.1.1'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // Zero runtime dependencies!
    
    // Testing
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.85
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'Jodash'
                description = 'Lodash-inspired pragmatic utility toolkit for modern Java (Java 17+).'
                url = 'https://github.com/hsnacar/jodash'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'hsnacar'
                        name = 'Hasan Acar'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/hsnacar/jodash.git'
                    developerConnection = 'scm:git:ssh://github.com/hsnacar/jodash.git'
                    url = 'https://github.com/hsnacar/jodash'
                }
            }
        }
    }
}

signing {
    required { gradle.taskGraph.hasTask('publish') || gradle.taskGraph.hasTask('publishToMavenLocal') }
    useGpgCmd()
    sign publishing.publications.mavenJava
}
